[project]
name = "exam-integrity-backend"
version = "1.0.0"
description = "AI Exam Integrity & Cheating Detection System backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "python-dotenv",
    "scikit-learn",
    "pandas",
    "numpy",
    "python-multipart",
    "email-validator",
    "python-jose",
    "passlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]